# Reusable build of both distributables. Called by ci.yml (every push / PR)
# and release.yml (tags), so what CI tests is exactly what gets released.
name: build

on:
  workflow_call:
  workflow_dispatch:

env:
  LLAMA_TAG: v0.5.0

jobs:
  rust:
    name: Rust core (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --manifest-path rust/kader-core/Cargo.toml --check
      - name: clippy
        run: cargo clippy --manifest-path rust/kader-core/Cargo.toml --release --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --manifest-path rust/kader-core/Cargo.toml --release --locked

  arch:
    name: Arch Linux package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed git cmake ninja rust pkgconf \
            qt6-base qt6-declarative qt6-multimedia qt6-positioning qt6-svg \
            qt6-shadertools qt6-tools libvips exiv2 libraw libheif poppler openssl polkit
      - uses: actions/checkout@v4
      - name: Checkout milfs-connect (sibling-app event bus)
        uses: actions/checkout@v4
        with:
          repository: vndreiii/milfs-connect
          path: milfs-connect
      - name: Install milfs-connect
        run: |
          cmake -S milfs-connect -B milfs-connect/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr -DMILFS_CONNECT_BUILD_TESTS=OFF 
          cmake --build milfs-connect/build
          cmake --install milfs-connect/build
          rm -rf milfs-connect
      - name: makepkg
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          sudo -u builder git config --global --add safe.directory '*'
          (cd packaging/arch && sudo -u builder makepkg --noconfirm --cleanbuild)
          # pacman names it kader-1:X.Y.Z-…; colons are not allowed in
          # release asset names, so publish it without the epoch prefix.
          mkdir -p dist
          for f in packaging/arch/kader-*.pkg.tar.zst; do b="$(basename "$f")"; mv "$f" "dist/${b/1:/}"; done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  appimage:
    name: AppImage
    runs-on: ubuntu-latest
    # Oldest supported base → the AppImage runs on any distro with glibc ≥ 2.35.
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git file \
            build-essential cmake ninja-build pkg-config python3 python3-pip \
            libvips-dev libexiv2-dev libraw-dev libpoppler-cpp-dev libssl-dev \
            libgl1-mesa-dev libegl1-mesa-dev libopengl0 libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libwayland-dev libwayland-egl1 libfontconfig1 libdbus-1-3 \
            patchelf desktop-file-utils zsync \
            libpulse0 xvfb xauth libgl1-mesa-dri weston libegl-mesa0 libwayland-egl1 \
            libx11-6 libxext6 libxrandr2 libxfixes3 libxrender1 libxcb-shm0 libxcb-xfixes0 \
            libxcb-randr0 libxcb-shape0 libegl1 libdrm2 libva2 libva-drm2 libva-x11-2 libvdpau1
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # aqtinstall with the container's own Python (install-qt-action brings a
      # Python built for a newer glibc than 22.04 has).
      # Explicit restore/save (not actions/cache) so the cache is written right
      # after installing, before packaging prunes plugins from the install.
      - name: Restore Qt
        id: qtcache
        uses: actions/cache/restore@v4
        with:
          path: /opt/qt
          key: qt-6.8.3-linux-gcc64-2
      - name: Install Qt 6.8
        run: |
          if [ ! -x /opt/qt/6.8.3/gcc_64/bin/qmake ]; then
            python3 -m pip install --quiet 'aqtinstall==3.3.*'
            python3 -m aqt install-qt linux desktop 6.8.3 linux_gcc_64 -O /opt/qt \
              -m qtmultimedia qtpositioning qtlocation qtshadertools qtimageformats qtwaylandcompositor
          fi
          echo "QT_ROOT_DIR=/opt/qt/6.8.3/gcc_64" >> "$GITHUB_ENV"
          echo "/opt/qt/6.8.3/gcc_64/bin" >> "$GITHUB_PATH"
      - name: Save Qt
        if: steps.qtcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /opt/qt
          key: qt-6.8.3-linux-gcc64-2
      - name: Checkout milfs-connect (sibling-app event bus)
        uses: actions/checkout@v4
        with:
          repository: vndreiii/milfs-connect
          path: milfs-connect
      - name: Install milfs-connect
        run: |
          cmake -S milfs-connect -B milfs-connect/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr -DMILFS_CONNECT_BUILD_TESTS=OFF -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build milfs-connect/build
          cmake --install milfs-connect/build
          rm -rf milfs-connect
      - name: Cache llama.cpp
        uses: actions/cache@v4
        with:
          path: ~/llama
          key: llama-${{ env.LLAMA_TAG }}-jammy-static-1
      - name: Build llama.cpp (static)
        run: test -f ~/llama/lib/libllama.a || packaging/build-llama.sh ~/llama
      - name: Build Kader
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_PREFIX_PATH="$HOME/llama;$QT_ROOT_DIR" -DKADER_UPDATE_CHANNEL=appimage
          cmake --build build
      - name: Package AppImage
        run: |
          # Kader only uses SQLite; the other SQL drivers link client libraries
          # that aren't installed, which linuxdeploy-plugin-qt treats as fatal.
          # Removed only now (after configure/build), since Qt's CMake package
          # references them.
          find "$QT_ROOT_DIR/plugins/sqldrivers" -name 'libqsql*.so' ! -name 'libqsqlite.so' -delete
          QMAKE="$QT_ROOT_DIR/bin/qmake" packaging/appimage/build-appimage.sh build dist
      - name: Check Wayland support is bundled
        run: |
          ls build/AppDir/usr/plugins/platforms
          ls build/AppDir/usr/plugins/platforms | grep -q wayland \
            || { echo "::error::Wayland platform plugin missing from the AppImage"; exit 1; }
          # the GL integration the wayland plugin loads at runtime
          ls build/AppDir/usr/plugins/wayland-graphics-integration-client | grep -q wayland-egl \
            || { echo "::error::Wayland EGL integration missing from the AppImage"; exit 1; }
      - name: Smoke test the AppImage
        run: |
          # Loads every view; fails on QML errors such as a module whose
          # libraries were not bundled.
          APPIMAGE_EXTRACT_AND_RUN=1 KADER_SMOKE_TEST=1 LIBGL_ALWAYS_SOFTWARE=1 \
            QSG_RHI_BACKEND=opengl QT_QPA_PLATFORM=xcb \
            timeout 180 xvfb-run -a dist/Kader-*-x86_64.AppImage
      - name: Smoke test the AppImage on Wayland
        run: |
          # Headless Weston + Mesa's software EGL: the same path Hyprland,
          # niri, GNOME and KDE take (wayland platform plugin, EGL context).
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=wl-ci --idle-time=0 &
          for i in $(seq 50); do [ -S "$XDG_RUNTIME_DIR/wl-ci" ] && break; sleep 0.2; done
          APPIMAGE_EXTRACT_AND_RUN=1 KADER_SMOKE_TEST=1 LIBGL_ALWAYS_SOFTWARE=1 \
            WAYLAND_DISPLAY=wl-ci QT_QPA_PLATFORM=wayland \
            timeout 180 dist/Kader-*-x86_64.AppImage
          kill %1 || true
      - name: Check Qt Multimedia is bundled
        run: |
          ls build/AppDir/usr/lib | grep -q '^libQt6MultimediaQuick.so' \
            || { echo "::error::Qt Multimedia missing from the AppImage"; exit 1; }
          ls build/AppDir/usr/plugins/multimedia
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: |
            dist/*.AppImage
            dist/*.zsync
          if-no-files-found: error
